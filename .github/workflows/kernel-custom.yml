name: Android 内核构建-自定义

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== 内核版本配置 ====================
      android_version:
        description: "Android 版本"
        required: true
        type: choice
        options:
          - android12
          - android13
          - android14
          - android15
          - android16
        default: android12
      kernel_version:
        description: "内核版本"
        required: true
        type: choice
        options:
          - "5.10"
          - "5.15"
          - "6.1"
          - "6.6"
          - "6.12"
        default: "5.10"
      sub_level:
        description: "子版本号 (如 66, 198, X)"
        required: true
        type: string
        default: "66"
      os_patch_level:
        description: "安全补丁级别 (如 2022-01, lts)"
        required: true
        type: string
        default: "2022-01"
      revision:
        description: "修订版本 (如 r11, 仅 5.10 需要)"
        required: false
        type: string
        default: "r11"

      # ==================== KernelSU 配置 ====================
      kernelsu_variant:
        description: "KernelSU 变体"
        required: true
        type: choice
        options:
          - Official
          #- Next
          - SukiSU
          - ReSukiSU
        default: ReSukiSU

      # ★ 新增：KSU 版本选择器（替代原来形同虚设的 kernelsu_branch）
      #   说明：原来 Stable/Dev 对 Official 都落到 -s main，选项无实际作用，
      #   且内核版本由脚本自算(20000+commit数)，与上游真实版本脱节，
      #   导致内核版本(32653) 高于管理器预构建版本(32632) 而无法匹配。
      #   现在改为显式选择上游 ref，内核与管理器从同一来源取版本。
      ksu_version:
        description: "KSU 版本（决定内核与管理器版本，强烈建议用具体 tag）"
        required: true
        type: choice
        options:
          - "latest (跟随上游最新，这个选项有时候有bug，不建议使用)"
          - "v3.3.0"
          - "v3.1.0"
          - "v3.0.0"
          - "v1.0.1"
          - "v1.0.0"
          - "v0.9.5"
          - "custom (用下方自定义 ref)"
        default: "latest (跟随上游最新)"

      ksu_custom_ref:
        description: "自定义 KSU ref（仅当上面选 custom 时生效；可填 tag / 分支 / commit）"
        required: false
        type: string
        default: ""

      kernelsu_branch:
        description: "KSU 分支（旧选项，仅 SukiSU/ReSukiSU 生效）"
        required: true
        type: choice
        options:
          - Stable(标准)
          - Dev(开发)
          - Other(其他/指定)
        default: Stable(标准)

      # ==================== 可选配置 ====================
      version:
        description: "自定义版本名 (可选)"
        required: false
        type: string
      build_time:
        description: "自定义构建时间 (可选，N或留空=当前UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"

      # ==================== 选项配置 ====================
      use_kpm:
        description: "KPM 功能（patched 尚不支持）"
        required: true
        type: choice
        default: "disabled (关闭)"
        options:
          - "disabled (关闭)"
          - "enabled (开启)"
          - "patched (开启并修补，尚不支持)"
      droidspaces:
        description: "Droidspaces 容器支持 (5.10~6.6: 槽位补丁, 6.12: 开/关)"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"

      # ==================== 功能开关 ====================
      use_zram:
        description: "启用 ZRAM 增强算法"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "启用 BBG 防格机"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "启用 Re-Kernel 驱动"
        required: false
        type: boolean
        default: false
      cancel_susfs:
        description: "禁用 SUSFS"
        required: true
        type: boolean
        default: false
      supp_op:
        description: "启用一加 8E 支持"
        required: false
        type: boolean
        default: false

jobs:
  build-custom-kernel:
    name: "${{ inputs.kernel_version }}.${{ inputs.sub_level }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: ${{ inputs.android_version }}
      kernel_version: ${{ inputs.kernel_version }}
      sub_level: ${{ inputs.sub_level }}
      os_patch_level: ${{ inputs.os_patch_level }}
      revision: ${{ inputs.revision || '' }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      ksu_branch: ${{ inputs.kernelsu_branch }}
      # ★ 新增透传：内核侧按此 ref 取源码
      ksu_version: ${{ inputs.ksu_version }}
      ksu_custom_ref: ${{ inputs.ksu_custom_ref || '' }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ !inputs.cancel_susfs }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}

  get-ksu-manager:
    # ★ 管理器改为从上游 Releases 取正式版，且必须等内核侧解析出真实版本后再取，
    #   以便校验“管理器版本 >= 内核版本”，避免再次出现 32632 < 32653 的错配。
    needs: build-custom-kernel
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      ksu_version: ${{ inputs.ksu_version }}
      ksu_custom_ref: ${{ inputs.ksu_custom_ref || '' }}
      # 用内核侧输出的真实版本号做校验（见 build.yml 新增 outputs）
      kernel_ksu_version: ${{ needs.build-custom-kernel.outputs.ksu_version_code || '' }}
